schema: 1
id: org.fleet.notifications
name: Notifications
description: Torrent notifications via ntfy, Gotify, Slack, Pushover, or email.
version: 1.0.0
api: ">=1.0.0 <2.0.0"
engines:
  - rtorrent
capabilities:
  - storage.read
  - storage.write
  - torrents.read
  - http.fetch
frontend:
  type: declarative
  entry: ui/extension.json
backend:
  type: process
  executable: bin/notifications-worker
  protocol: jsonrpc-2
